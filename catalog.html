<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'"/>
<title>Catálogo</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --gbg:   rgba(14, 14, 20, 0.94);
  --gbord: rgba(255,255,255,.10);
  --text:  #ebebeb;
  --sub:   #8a8a96;
  --muted: #44444c;
  --blue:  #4d9de0;
  --sep:   rgba(255,255,255,.06);
  --hov:   rgba(255,255,255,.05);
  --field: rgba(255,255,255,.06);
  --r:     14px;
}

[data-theme="light"] {
  --gbg:   rgba(250, 250, 255, 0.96);
  --gbord: rgba(0,0,0,.09);
  --text:  #16161e;
  --sub:   #6b6b7e;
  --muted: #6e6e80;
  --sep:   rgba(0,0,0,.07);
  --hov:   rgba(0,0,0,.04);
  --field: rgba(0,0,0,.05);
}

html, body {
  height: 100vh; overflow: hidden; background: transparent;
  font-family: 'Segoe UI', system-ui, sans-serif;
  color: var(--text); user-select: none; -webkit-font-smoothing: antialiased;
}

#wrap {
  height: 100vh; border-radius: var(--r);
  background: var(--gbg); border: 1px solid var(--gbord);
  display: flex; flex-direction: column; overflow: hidden;
}

/* ── Header ─────────────────────────────────────── */
#hdr {
  display: flex; align-items: center; gap: 8px;
  padding: 11px 12px 10px 14px; border-bottom: 1px solid var(--sep);
  flex-shrink: 0; -webkit-app-region: drag;
}
/* Las pestanas viven dentro de la zona arrastrable del header: sin su propio
   no-drag el clic lo consume el arrastre de la ventana y no cambian nunca. */
#tabs { display: flex; gap: 14px; -webkit-app-region: no-drag; }
.tab {
  font-size: 12.5px; font-weight: 700; letter-spacing: .06em;
  padding-bottom: 2px; cursor: pointer; color: var(--muted);
  border-bottom: 2px solid transparent; transition: color .12s;
}
.tab:hover { color: var(--sub); }
.tab.on {
  background: linear-gradient(90deg, #818cf8, #38bdf8);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text; border-bottom-color: #6d84f0;
}
#hdr-count { font-size: 10.5px; color: var(--muted); flex: 1; text-align: right; }
#hdr-refresh, #hdr-close {
  -webkit-app-region: no-drag; cursor: pointer;
  padding: 3px 6px; border-radius: 5px; line-height: 1;
  transition: background .15s, color .15s;
}
#hdr-refresh { color: var(--blue); font-size: 14px; }
#hdr-refresh:hover { background: rgba(77,157,224,.12); }
#hdr-refresh.spin { animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
#hdr-close { color: #f87171; font-size: 11px; }
#hdr-close:hover { color: #ef4444; background: rgba(239,68,68,.12); }

/* ── Buscador ───────────────────────────────────── */
#search-row { padding: 10px 14px; border-bottom: 1px solid var(--sep); flex-shrink: 0; }
#q {
  width: 100%; padding: 7px 10px; font-size: 12px;
  font-family: inherit; color: var(--text);
  background: var(--field); border: 1px solid transparent; border-radius: 7px;
  outline: none; user-select: text;
}
#q::placeholder { color: var(--muted); }
#q:focus { border-color: rgba(77,157,224,.45); }

/* ── Lista ──────────────────────────────────────── */
#list { flex: 1; overflow-y: auto; padding: 6px 0 10px; }
#list::-webkit-scrollbar { width: 8px; }
#list::-webkit-scrollbar-thumb {
  background: rgba(255,255,255,.12); border-radius: 4px;
}
[data-theme="light"] #list::-webkit-scrollbar-thumb { background: rgba(0,0,0,.16); }

.sec-h, .grp-h {
  display: flex; align-items: center; gap: 6px;
  cursor: pointer; transition: background .12s;
}
.sec-h { padding: 8px 14px 6px; }
.sec-h:hover, .grp-h:hover { background: var(--hov); }
.sec-t { font-size: 11px; font-weight: 700; letter-spacing: .04em; }
.sec-n { font-size: 10px; color: var(--muted); flex: 1; }
.sec-p { font-size: 9.5px; color: var(--muted); }

.grp-h { padding: 5px 14px 5px 24px; }
.grp-t { font-size: 11px; font-weight: 600; color: var(--sub); }
.grp-v {
  font-size: 9px; color: var(--muted); padding: 1px 5px;
  border: 1px solid var(--sep); border-radius: 4px;
}
.grp-n { font-size: 10px; color: var(--muted); flex: 1; text-align: right; }

.caret {
  font-size: 8px; color: var(--muted); width: 8px;
  transition: transform .15s; flex-shrink: 0;
}
.closed > .caret { transform: rotate(-90deg); }

.sk { padding: 5px 14px 6px 34px; }
.sk:hover { background: var(--hov); }
.sk-n { font-size: 11.5px; font-weight: 600; }
.sk-d {
  font-size: 10.5px; color: var(--sub); line-height: 1.35; margin-top: 1px;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  overflow: hidden;
}
.sk-warn { font-size: 10px; color: #f59e0b; margin-top: 1px; }
.hidden { display: none; }

/* ── Fila de MCP ────────────────────────────────── */
.mcp { padding: 5px 14px 6px 34px; }
.mcp:hover { background: var(--hov); }
.mcp-top { display: flex; align-items: center; gap: 6px; }
.mcp-n { font-size: 11.5px; font-weight: 600; }
.mcp-t {
  font-size: 9px; color: var(--muted); padding: 1px 5px;
  border: 1px solid var(--sep); border-radius: 4px;
}
.mcp-st { font-size: 10px; margin-left: auto; flex-shrink: 0; }
.mcp-on  { color: #4ade80; }
.mcp-off { color: var(--muted); }
/* Un comando con muchos args o una URL larga no deben ensanchar la ventana. */
.mcp-d {
  font-size: 10.5px; color: var(--sub); line-height: 1.35; margin-top: 1px;
  word-break: break-all;
}
.mcp-k { font-size: 9.5px; color: var(--muted); margin-top: 2px; word-break: break-all; }

#msg {
  padding: 40px 24px; text-align: center;
  font-size: 12px; color: var(--muted); line-height: 1.5;
}
</style>
</head>
<body>
<div id="wrap">

  <div id="hdr">
    <div id="tabs">
      <span class="tab on" data-tab="skills">SKILLS</span>
      <span class="tab"    data-tab="mcps">MCPs</span>
    </div>
    <span id="hdr-count">–</span>
    <span id="hdr-refresh" title="Volver a escanear">⟳</span>
    <span id="hdr-close" title="Cerrar">✕</span>
  </div>

  <div id="search-row">
    <input id="q" type="text" autocomplete="off"/>
  </div>

  <div id="list"><div id="msg">Escaneando…</div></div>

</div>

<script>
// El widget guarda el tema en localStorage; ambas ventanas comparten el origen
// file://, asi que el catalogo abre con el mismo tema. Si no hay valor, oscuro.
document.documentElement.setAttribute(
  'data-theme', localStorage.getItem('theme') === 'light' ? 'light' : 'dark');

const listEl  = document.getElementById('list');
const countEl = document.getElementById('hdr-count');
const qEl     = document.getElementById('q');

function esc(s) {
  return String(s).replace(/[&<>"]/g, (c) => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]
  ));
}

function skillRow(s) {
  const desc = s.parsed
    ? `<div class="sk-d">${esc(s.description)}</div>`
    : '<div class="sk-warn">sin frontmatter legible</div>';
  return `<div class="sk"><div class="sk-n">${esc(s.name)}</div>${desc}</div>`;
}

function mcpRow(m) {
  if (!m.parsed) {
    return `<div class="mcp"><div class="mcp-top"><span class="mcp-n">${esc(m.name)}</span></div>
      <div class="sk-warn">no se pudo leer su configuración</div></div>`;
  }

  const tp = m.transport ? `<span class="mcp-t">${esc(m.transport)}</span>` : '';
  const st = m.enabled
    ? '<span class="mcp-st mcp-on">● activo</span>'
    : '<span class="mcp-st mcp-off">○ apagado</span>';

  // Solo los NOMBRES de las claves: el escaner nunca entrega los valores.
  const keys = [
    m.envKeys.length    ? 'env: '     + m.envKeys.join(', ')    : '',
    m.headerKeys.length ? 'headers: ' + m.headerKeys.join(', ') : '',
  ].filter(Boolean).join('   ·   ');

  return `<div class="mcp">
    <div class="mcp-top"><span class="mcp-n">${esc(m.name)}</span>${tp}${st}</div>
    ${m.detail ? `<div class="mcp-d">${esc(m.detail)}</div>` : ''}
    ${m.note   ? `<div class="mcp-k">${esc(m.note)}</div>`   : ''}
    ${keys     ? `<div class="mcp-k">${esc(keys)}</div>`     : ''}
  </div>`;
}

// El main devuelve {items, error}. Un error del escaneo se convierte en excepcion
// para que lo atrape el mismo catch que un fallo del IPC y se pinte igual.
function unwrap(key) {
  return (res) => {
    if (res.error) throw new Error(res.error);
    return res[key];
  };
}

// Cada pestana guarda lo suyo: sus datos, su busqueda y sus grupos colapsados.
// data null significa "no escaneada todavia": la de MCPs no escanea hasta que la
// abres. La fuente "flat" es la que se lista sin agrupar por plugin/proyecto.
const TABS = {
  skills: {
    data: null, query: '', closed: new Set(),
    row:   skillRow,
    scan:  () => window.catalog.scanSkills().then(unwrap('skills')),
    text:  (s) => s.name + ' ' + s.description,
    unit:  (n) => `${n} skill${n === 1 ? '' : 's'}`,
    flat:  'personal',
    ph:    'Buscar skill por nombre o descripción…',
    none:  'No se encontraron skills instaladas.<br/>' +
           'Se buscó en ~/.claude/skills, los plugins instalados y los proyectos registrados.',
    sections: [
      ['personal', 'Personales', '~/.claude/skills'],
      ['plugin',   'Plugins',    ''],
      ['project',  'Proyectos',  ''],
    ],
  },
  mcps: {
    data: null, query: '', closed: new Set(),
    row:   mcpRow,
    scan:  () => window.catalog.scanMcps().then(unwrap('mcps')),
    text:  (m) => m.name + ' ' + m.detail,
    unit:  (n) => `${n} MCP${n === 1 ? '' : 's'}`,
    flat:  'user',
    ph:    'Buscar servidor MCP por nombre o comando…',
    none:  'No se encontraron servidores MCP declarados.<br/>' +
           'Se buscó en los plugins instalados, ~/.claude.json y los proyectos registrados.',
    sections: [
      ['user',    'Usuario',   '~/.claude.json'],
      ['plugin',  'Plugins',   ''],
      ['project', 'Proyectos', ''],
    ],
  },
};

let tab = 'skills';
function T() { return TABS[tab]; }

function matches(item) {
  const q = T().query;
  if (!q) return true;
  return T().text(item).toLowerCase().includes(q.toLowerCase());
}

// Al buscar, todo se muestra abierto: colapsar esconderia coincidencias.
function isClosed(key) { return !T().query && T().closed.has(key); }

function section(key, title, count, note, inner) {
  const cls = isClosed(key) ? ' closed' : '';
  return `<div class="sec">
    <div class="sec-h${cls}" data-key="${esc(key)}">
      <span class="caret">▼</span>
      <span class="sec-t">${esc(title)}</span>
      <span class="sec-n">(${count})</span>
      <span class="sec-p">${esc(note)}</span>
    </div>
    <div class="sec-b${isClosed(key) ? ' hidden' : ''}">${inner}</div>
  </div>`;
}

function group(key, title, version, items) {
  const cls = isClosed(key) ? ' closed' : '';
  const ver = version ? `<span class="grp-v">v${esc(version)}</span>` : '';
  return `<div class="grp">
    <div class="grp-h${cls}" data-key="${esc(key)}">
      <span class="caret">▼</span>
      <span class="grp-t">${esc(title)}</span>${ver}
      <span class="grp-n">(${items.length})</span>
    </div>
    <div class="grp-b${isClosed(key) ? ' hidden' : ''}">${items.map(T().row).join('')}</div>
  </div>`;
}

function byName(a, b) { return a.name.localeCompare(b.name); }

function groupBy(items) {
  const map = new Map();
  for (const s of items) {
    if (!map.has(s.group)) map.set(s.group, []);
    map.get(s.group).push(s);
  }
  return [...map.entries()].sort((a, b) => a[0].localeCompare(b[0]));
}

function render() {
  const all   = T().data || [];
  const shown = all.filter(matches);

  countEl.textContent = T().query
    ? `${shown.length} de ${all.length}`
    : T().unit(all.length);

  if (!all.length) {
    listEl.innerHTML = `<div id="msg">${T().none}</div>`;
    return;
  }
  if (!shown.length) {
    listEl.innerHTML = `<div id="msg">Sin coincidencias para «${esc(T().query)}».</div>`;
    return;
  }

  let html = '';

  for (const [src, title, note] of T().sections) {
    const items = shown.filter((s) => s.source === src);
    if (!items.length) continue;

    // Las claves de colapso llevan la pestana adentro: skills y MCPs comparten
    // nombres de plugin y si no, colapsar un grupo en una colapsaria el otro.
    const key = `${tab}:${src}`;

    const inner = src === T().flat
      ? items.slice().sort(byName).map(T().row).join('')
      : groupBy(items).map(([name, arr]) =>
          group(`${key}:${name}`, name, arr[0].version, arr.slice().sort(byName))).join('');

    html += section(key, title, items.length, note, inner);
  }

  listEl.innerHTML = html;
}

// Colapsar / expandir por delegacion: el HTML se regenera en cada render.
listEl.addEventListener('click', (e) => {
  const head = e.target.closest('.sec-h, .grp-h');
  if (!head || T().query) return;      // durante una busqueda no se colapsa
  const key = head.dataset.key;
  if (T().closed.has(key)) T().closed.delete(key); else T().closed.add(key);
  render();
});

qEl.addEventListener('input', (e) => {
  T().query = e.target.value.trim();
  render();
});

document.getElementById('hdr-close').addEventListener('click', () => window.catalog.close());

async function load() {
  const btn  = document.getElementById('hdr-refresh');
  const from = tab;                    // la pestana puede cambiar mientras escanea
  btn.classList.add('spin');
  try {
    const data = await TABS[from].scan();
    TABS[from].data = data;
    if (tab === from) render();
  } catch (e) {
    TABS[from].data = [];
    if (tab === from) {
      listEl.innerHTML = `<div id="msg">No se pudo escanear.<br/>${esc(e.message)}</div>`;
      countEl.textContent = '–';
    }
  } finally {
    btn.classList.remove('spin');
  }
}

function show(next) {
  if (next === tab) return;
  tab = next;
  for (const el of document.querySelectorAll('.tab')) {
    el.classList.toggle('on', el.dataset.tab === tab);
  }
  qEl.placeholder = T().ph;
  qEl.value       = T().query;

  if (T().data === null) {
    listEl.innerHTML = '<div id="msg">Escaneando…</div>';
    countEl.textContent = '–';
    load();
  } else {
    render();
  }
}

document.getElementById('tabs').addEventListener('click', (e) => {
  const el = e.target.closest('.tab');
  if (el) show(el.dataset.tab);
});

document.getElementById('hdr-refresh').addEventListener('click', load);

qEl.placeholder = T().ph;
load();
</script>
</body>
</html>
